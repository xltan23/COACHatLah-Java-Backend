spring.config.import=optional:secrets.properties

# Each ${ENV_VAR:default} below uses the default locally and the env var on Railway

# Railway injects PORT
server.port=${PORT:8080}

# Frontend origins allowed to open the WebSocket (comma-separated); on Railway, the Vercel URL
app.allowed-origins=${ALLOWED_ORIGINS:http://localhost:4200}

# Moderation Service (Python) - not a secret, so it lives here rather than in secrets.properties
moderation.service.url=${MODERATION_SERVICE_URL:http://localhost:8000}

# Spike Detection Service (Python)
spike.service.url=${SPIKE_SERVICE_URL:http://localhost:8001}

